name: Deploy to AKS

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Build, push to ACR, deploy to AKS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.LOGIN_SERVER }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile
          push: true
          tags: |
            ${{ secrets.LOGIN_SERVER }}/investor-intelligence-platform:${{ github.sha }}
            ${{ secrets.LOGIN_SERVER }}/investor-intelligence-platform:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Apply manifests
        run: kubectl apply -f k8s/deployment.yaml -f k8s/service.yaml

      - name: Roll out the freshly built image
        run: |
          kubectl set image deployment/investor-intel \
            investor-intel=${{ secrets.LOGIN_SERVER }}/investor-intelligence-platform:${{ github.sha }}
          kubectl rollout status deployment/investor-intel --timeout=180s

      - name: Show external IP
        run: kubectl get service investor-intel
