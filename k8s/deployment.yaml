apiVersion: apps/v1
kind: Deployment

metadata:
  name: investor-intel

spec:
  replicas: 1

  selector:
    matchLabels:
      app: investor-intel

  template:
    metadata:
      labels:
        app: investor-intel

    spec:
      containers:
      - name: investor-intel

        # Placeholder - the deploy workflow (.github/workflows/deploy.yml)
        # overrides this via `kubectl set image` right after applying, using
        # the real ACR login server from a GitHub secret. Update this value
        # too if ever applying this manifest by hand.
        image: <ACR_LOGIN_SERVER>/investor-intelligence-platform:latest

        imagePullPolicy: Always

        envFrom:
        - secretRef:
            name: investor-intel-secrets

        ports:
        - containerPort: 8000
